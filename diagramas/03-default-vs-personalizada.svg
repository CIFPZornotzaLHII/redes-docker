<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580" role="img" aria-labelledby="title desc">
  <title id="title">Bridge por defecto frente a bridge personalizada</title>
  <desc id="desc">En la red bridge por defecto no hay DNS: ping alpine2 falla y solo funciona usando la IP. En una red personalizada Docker ofrece un DNS interno en 127.0.0.11 y ping alpine4 funciona por nombre. Además, ambas redes están aisladas entre sí.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #1f2328; }
      .mono { font-family: Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; }
      .title { font-size: 22px; font-weight: 700; }
      .sub { font-size: 14px; fill: #59636e; }
      .ph { font-size: 17px; font-weight: 700; }
      .cmd { font-size: 12px; fill: #424a53; }
      .net { font-size: 13px; font-weight: 700; }
      .badge { font-size: 12px; font-weight: 700; }
      .h { font-size: 14px; font-weight: 700; }
      .ip { font-size: 12px; }
      .q { font-size: 11.5px; font-weight: 700; }
      .term { font-size: 12.5px; }
      .t-cmd { fill: #e6edf3; }
      .t-ok { fill: #7ee787; }
      .t-ko { fill: #ff8182; }
      .t-info { fill: #79c0ff; }
      .t-dim { fill: #8b949e; }
      .ok { fill: #1a7f37; }
      .ko { fill: #cf222e; }
      .w { fill: #ffffff; }
      .note-h { font-size: 13.5px; font-weight: 700; fill: #82071e; }
      .note { font-size: 12.5px; fill: #1f2328; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="579" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="28" y="42" class="title">Bridge por defecto vs. bridge personalizada</text>
  <text x="28" y="66" class="sub">Mismo driver, comportamiento muy distinto. Esta es LA diferencia que tenéis que entender hoy.</text>

  <!-- ============ IZQUIERDA: DEFAULT ============ -->
  <rect x="24" y="88" width="440" height="400" rx="12" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
  <text x="44" y="118" class="ph">Red bridge por defecto</text>
  <text x="44" y="139" class="mono cmd">docker run -dit --name alpine1 alpine sh</text>

  <rect x="44" y="156" width="400" height="42" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="58" y="182" class="net">bridge (docker0) · <tspan class="mono" style="font-weight:400">172.17.0.0/16</tspan></text>
  <rect x="338" y="163" width="96" height="28" rx="6" fill="#ffebe9" stroke="#cf222e" stroke-dasharray="3 2"/>
  <text x="386" y="182" text-anchor="middle" class="badge ko">sin DNS</text>

  <text x="244" y="221" text-anchor="middle" class="mono q ko">«alpine2» → ???</text>
  <line x1="144" y1="198" x2="144" y2="234" stroke="#9a6700" stroke-width="2.5"/>
  <line x1="344" y1="198" x2="344" y2="234" stroke="#9a6700" stroke-width="2.5"/>
  <rect x="64" y="234" width="160" height="62" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="144" y="259" text-anchor="middle" class="h">alpine1</text>
  <text x="144" y="281" text-anchor="middle" class="mono ip">172.17.0.2</text>
  <rect x="264" y="234" width="160" height="62" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="344" y="259" text-anchor="middle" class="h">alpine2</text>
  <text x="344" y="281" text-anchor="middle" class="mono ip">172.17.0.3</text>

  <rect x="44" y="316" width="400" height="152" rx="8" fill="#161b22"/>
  <text x="60" y="342" class="mono term t-cmd">/ # ping -c 1 alpine2</text>
  <text x="60" y="364" class="mono term t-ko">ping: bad address 'alpine2'</text>
  <text x="60" y="386" class="mono term t-cmd">/ # ping -c 1 172.17.0.3</text>
  <text x="60" y="408" class="mono term t-ok">64 bytes from 172.17.0.3: seq=0</text>
  <text x="60" y="430" class="mono term t-cmd">/ # cat /etc/resolv.conf</text>
  <text x="60" y="452" class="mono term t-info">nameserver 192.168.65.7 <tspan class="t-dim"># DNS del host</tspan></text>

  <!-- ============ DERECHA: PERSONALIZADA ============ -->
  <rect x="496" y="88" width="440" height="400" rx="12" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="516" y="118" class="ph">Red bridge personalizada</text>
  <text x="516" y="139" class="mono cmd">docker network create red-clase</text>

  <rect x="516" y="156" width="400" height="42" rx="8" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
  <text x="530" y="182" class="net">red-clase · <tspan class="mono" style="font-weight:400">10.10.0.0/24</tspan></text>
  <rect x="768" y="163" width="140" height="28" rx="6" fill="#1a7f37"/>
  <text x="838" y="182" text-anchor="middle" class="mono badge w">DNS 127.0.0.11</text>

  <text x="716" y="221" text-anchor="middle" class="mono q ok">«alpine4» → 10.10.0.3</text>
  <line x1="616" y1="198" x2="616" y2="234" stroke="#1a7f37" stroke-width="2.5"/>
  <line x1="816" y1="198" x2="816" y2="234" stroke="#1a7f37" stroke-width="2.5"/>
  <rect x="536" y="234" width="160" height="62" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="616" y="259" text-anchor="middle" class="h">alpine3</text>
  <text x="616" y="281" text-anchor="middle" class="mono ip">10.10.0.2</text>
  <rect x="736" y="234" width="160" height="62" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="816" y="259" text-anchor="middle" class="h">alpine4</text>
  <text x="816" y="281" text-anchor="middle" class="mono ip">10.10.0.3</text>

  <rect x="516" y="316" width="400" height="152" rx="8" fill="#161b22"/>
  <text x="532" y="342" class="mono term t-cmd">/ # ping -c 1 alpine4</text>
  <text x="532" y="364" class="mono term t-dim">PING alpine4 (10.10.0.3): 56 data bytes</text>
  <text x="532" y="386" class="mono term t-ok">64 bytes from 10.10.0.3: seq=0</text>
  <text x="532" y="408" class="mono term t-cmd">/ # cat /etc/resolv.conf</text>
  <text x="532" y="430" class="mono term t-info">nameserver 127.0.0.11 <tspan class="t-dim"># DNS de Docker</tspan></text>
  <text x="532" y="452" class="mono term t-dim">options ndots:0</text>

  <!-- ============ AISLAMIENTO ============ -->
  <rect x="24" y="504" width="912" height="56" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <circle cx="52" cy="532" r="12" fill="#cf222e"/>
  <path d="M47,527 L57,537 M57,527 L47,537" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="76" y="527" class="note-h">Además, las dos redes están aisladas entre sí (son dos switches distintos).</text>
  <text x="76" y="547" class="note">Desde alpine3: <tspan class="mono">ping 172.17.0.2</tspan> → 100% packet loss. Para unirlas: <tspan class="mono">docker network connect red-clase alpine1</tspan></text>
</svg>
