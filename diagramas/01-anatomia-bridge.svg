<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">Anatomía de una red bridge</title>
  <desc id="desc">Tres contenedores, cada uno con su propio namespace de red, conectados mediante pares veth al switch virtual docker0, que sale a Internet a través de NAT y de la interfaz eth0 real del host.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #1f2328; }
      .mono { font-family: Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; }
      .title { font-size: 22px; font-weight: 700; }
      .sub { font-size: 14px; fill: #59636e; }
      .h { font-size: 15px; font-weight: 700; }
      .lbl { font-size: 12px; fill: #59636e; }
      .ip { font-size: 12px; }
      .num { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .lg-h { font-size: 14px; font-weight: 700; }
      .lg { font-size: 12.5px; fill: #424a53; }
      .veth { font-size: 12px; font-weight: 700; fill: #0969da; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="559" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="28" y="42" class="title">Anatomía de una red bridge</text>
  <text x="28" y="66" class="sub">Lo que Docker monta por dentro cada vez que hacéis docker run sin indicar --network</text>

  <!-- HOST -->
  <rect x="28" y="90" width="644" height="446" rx="12" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="46" y="116" class="h">HOST</text>
  <text x="96" y="116" class="lbl">vuestro PC con Linux, o la VM Linux de Docker Desktop</text>

  <!-- NAT -->
  <rect x="290" y="138" width="180" height="54" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="380" y="161" text-anchor="middle" class="h">NAT (iptables)</text>
  <text x="380" y="180" text-anchor="middle" class="mono ip">172.17.0.x → 192.168.1.20</text>

  <!-- eth0 real -->
  <rect x="520" y="138" width="132" height="54" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="586" y="161" text-anchor="middle" class="h">eth0 (real)</text>
  <text x="586" y="180" text-anchor="middle" class="mono ip">192.168.1.20</text>
  <line x1="470" y1="165" x2="516" y2="165" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Internet -->
  <line x1="652" y1="165" x2="734" y2="165" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <g fill="#eaeef2" stroke="none">
    <circle cx="762" cy="172" r="22"/>
    <circle cx="788" cy="152" r="26"/>
    <circle cx="818" cy="150" r="24"/>
    <circle cx="842" cy="170" r="22"/>
    <rect x="762" y="160" width="80" height="34"/>
  </g>
  <text x="802" y="174" text-anchor="middle" class="h">Internet</text>

  <!-- docker0 -->
  <line x1="380" y1="246" x2="380" y2="196" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="60" y="246" width="580" height="58" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
  <text x="350" y="271" text-anchor="middle" class="h">docker0 — switch virtual (bridge)</text>
  <text x="350" y="292" text-anchor="middle" class="mono ip">gateway 172.17.0.1 · red 172.17.0.0/16</text>

  <!-- veth -->
  <g stroke="#0969da" stroke-width="3">
    <line x1="158" y1="304" x2="158" y2="430"/>
    <line x1="350" y1="304" x2="350" y2="430"/>
    <line x1="542" y1="304" x2="542" y2="430"/>
  </g>
  <g fill="#0969da">
    <circle cx="158" cy="306" r="5"/><circle cx="158" cy="428" r="5"/>
    <circle cx="350" cy="306" r="5"/><circle cx="350" cy="428" r="5"/>
    <circle cx="542" cy="306" r="5"/><circle cx="542" cy="428" r="5"/>
  </g>
  <text x="168" y="344" class="veth">veth</text>
  <text x="360" y="344" class="veth">veth</text>
  <text x="552" y="344" class="veth">veth</text>

  <!-- Contenedores -->
  <g>
    <rect x="72" y="372" width="172" height="140" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="158" y="398" text-anchor="middle" class="h">alpine1</text>
    <text x="158" y="416" text-anchor="middle" class="lbl">namespace de red propio</text>
    <rect x="86" y="430" width="144" height="28" rx="6" fill="#ffffff" stroke="#54aeff"/>
    <text x="98" y="449" class="mono ip">eth0</text><text x="220" y="449" text-anchor="end" class="mono ip">172.17.0.2</text>
    <rect x="86" y="466" width="144" height="28" rx="6" fill="#ffffff" stroke="#54aeff"/>
    <text x="98" y="485" class="mono ip">lo</text><text x="220" y="485" text-anchor="end" class="mono ip">127.0.0.1</text>
  </g>
  <g>
    <rect x="264" y="372" width="172" height="140" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="350" y="398" text-anchor="middle" class="h">alpine2</text>
    <text x="350" y="416" text-anchor="middle" class="lbl">namespace de red propio</text>
    <rect x="278" y="430" width="144" height="28" rx="6" fill="#ffffff" stroke="#54aeff"/>
    <text x="290" y="449" class="mono ip">eth0</text><text x="412" y="449" text-anchor="end" class="mono ip">172.17.0.3</text>
    <rect x="278" y="466" width="144" height="28" rx="6" fill="#ffffff" stroke="#54aeff"/>
    <text x="290" y="485" class="mono ip">lo</text><text x="412" y="485" text-anchor="end" class="mono ip">127.0.0.1</text>
  </g>
  <g>
    <rect x="456" y="372" width="172" height="140" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="542" y="398" text-anchor="middle" class="h">web (nginx)</text>
    <text x="542" y="416" text-anchor="middle" class="lbl">namespace de red propio</text>
    <rect x="470" y="430" width="144" height="28" rx="6" fill="#ffffff" stroke="#54aeff"/>
    <text x="482" y="449" class="mono ip">eth0</text><text x="604" y="449" text-anchor="end" class="mono ip">172.17.0.4</text>
    <rect x="470" y="466" width="144" height="28" rx="6" fill="#ffffff" stroke="#54aeff"/>
    <text x="482" y="485" class="mono ip">lo</text><text x="604" y="485" text-anchor="end" class="mono ip">127.0.0.1</text>
  </g>

  <!-- Marcadores numerados en el dibujo -->
  <g fill="#1f2328">
    <circle cx="72" cy="372" r="12"/>
    <circle cx="136" cy="340" r="12"/>
    <circle cx="60" cy="246" r="12"/>
    <circle cx="290" cy="138" r="12"/>
  </g>
  <text x="72" y="377" text-anchor="middle" class="num">1</text>
  <text x="136" y="345" text-anchor="middle" class="num">2</text>
  <text x="60" y="251" text-anchor="middle" class="num">3</text>
  <text x="290" y="143" text-anchor="middle" class="num">4</text>

  <!-- Leyenda -->
  <g fill="#1f2328">
    <circle cx="712" cy="239" r="11"/>
    <circle cx="712" cy="315" r="11"/>
    <circle cx="712" cy="391" r="11"/>
    <circle cx="712" cy="467" r="11"/>
  </g>
  <text x="712" y="244" text-anchor="middle" class="num">1</text>
  <text x="712" y="320" text-anchor="middle" class="num">2</text>
  <text x="712" y="396" text-anchor="middle" class="num">3</text>
  <text x="712" y="472" text-anchor="middle" class="num">4</text>

  <text x="732" y="244" class="lg-h">Network namespace</text>
  <text x="700" y="266" class="lg">Cada contenedor tiene su propia</text>
  <text x="700" y="283" class="lg">pila de red: interfaces, IPs,</text>
  <text x="700" y="300" class="lg">rutas y puertos.</text>

  <text x="732" y="320" class="lg-h">Par veth</text>
  <text x="700" y="342" class="lg">Cable virtual con dos extremos:</text>
  <text x="700" y="359" class="lg">uno es el eth0 del contenedor,</text>
  <text x="700" y="376" class="lg">el otro se enchufa al bridge.</text>

  <text x="732" y="396" class="lg-h">Bridge docker0</text>
  <text x="700" y="418" class="lg">Switch virtual: todo lo que está</text>
  <text x="700" y="435" class="lg">enchufado a él se puede ver.</text>
  <text x="700" y="452" class="lg">Cada red nueva crea otro bridge.</text>

  <text x="732" y="472" class="lg-h">NAT</text>
  <text x="700" y="494" class="lg">Para salir a Internet, el host</text>
  <text x="700" y="511" class="lg">sustituye la IP del contenedor</text>
  <text x="700" y="528" class="lg">por la suya, como un router.</text>
</svg>
