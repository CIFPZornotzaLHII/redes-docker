<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Para saber más: overlay y macvlan</title>
  <desc id="desc">Overlay: dos contenedores en hosts distintos comparten una red virtual 10.0.1.0/24; sus paquetes viajan envueltos en un túnel VXLAN por la LAN física. Macvlan: el contenedor aparece en la LAN como un dispositivo más, con su propia IP y MAC, junto al PC y la impresora.</desc>
  <defs>
    <style>
      text { font-family: 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif; fill: #1f2328; }
      .mono { font-family: Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace; }
      .title { font-size: 22px; font-weight: 700; }
      .sub { font-size: 14px; fill: #59636e; }
      .drv { font-size: 19px; font-weight: 700; }
      .ph-sub { font-size: 12.5px; fill: #424a53; }
      .hl { font-size: 12.5px; font-weight: 700; }
      .h { font-size: 13px; font-weight: 700; }
      .ip { font-size: 11.5px; }
      .small { font-size: 11px; fill: #59636e; }
      .lbl { font-size: 12px; fill: #59636e; }
      .cap { font-size: 12.5px; fill: #1f2328; }
      .capm { font-size: 12px; fill: #59636e; }
      .purple { fill: #8250df; }
      .teal { fill: #1b7c83; }
      .warn { fill: #9a6700; }
      .cmd { font-size: 11.5px; fill: #424a53; }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="539" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="28" y="42" class="title">Para saber más: overlay y macvlan</text>
  <text x="28" y="66" class="sub">Hoy no los practicaréis (necesitan varios hosts o Linux nativo), pero tenéis que saber que existen</text>

  <!-- ============ OVERLAY ============ -->
  <rect x="24" y="88" width="440" height="428" rx="12" fill="#ffffff" stroke="#8250df" stroke-width="1.5"/>
  <text x="44" y="118" class="drv purple">overlay</text>
  <text x="44" y="140" class="ph-sub">Una sola red que atraviesa varios hosts (Docker Swarm)</text>

  <rect x="44" y="164" width="180" height="150" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="5 4"/>
  <text x="58" y="184" class="hl">Host A</text>
  <text x="212" y="184" text-anchor="end" class="mono ip">192.168.1.10</text>
  <rect x="284" y="164" width="180" height="150" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="5 4"/>
  <text x="298" y="184" class="hl">Host B</text>
  <text x="452" y="184" text-anchor="end" class="mono ip">192.168.1.11</text>

  <line x1="208" y1="244" x2="300" y2="244" stroke="#8250df" stroke-width="4"/>
  <text x="254" y="236" text-anchor="middle" class="small purple" style="font-weight:700">overlay</text>

  <rect x="60" y="214" width="148" height="60" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="134" y="238" text-anchor="middle" class="h">web.1</text>
  <text x="134" y="259" text-anchor="middle" class="mono ip">10.0.1.5</text>
  <rect x="300" y="214" width="148" height="60" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="374" y="238" text-anchor="middle" class="h">api.1</text>
  <text x="374" y="259" text-anchor="middle" class="mono ip">10.0.1.6</text>

  <g stroke="#57606a" stroke-width="3" fill="none">
    <polyline points="134,314 134,346 374,346 374,314"/>
  </g>
  <text x="254" y="366" text-anchor="middle" class="lbl">LAN física · 192.168.1.0/24</text>

  <rect x="74" y="384" width="360" height="40" rx="6" fill="#eaeef2" stroke="#57606a"/>
  <text x="88" y="409" class="mono ip">.1.10 → .1.11</text>
  <rect x="210" y="390" width="216" height="28" rx="5" fill="#fbefff" stroke="#8250df"/>
  <text x="318" y="409" text-anchor="middle" class="mono ip">10.0.1.5 → 10.0.1.6</text>
  <text x="44" y="446" class="cap">Túnel VXLAN: el paquete entre contenedores viaja</text>
  <text x="44" y="464" class="cap">«envuelto» dentro de un paquete entre hosts.</text>
  <text x="44" y="496" class="mono cmd">docker network create -d overlay mi-red</text>

  <!-- ============ MACVLAN ============ -->
  <rect x="496" y="88" width="440" height="428" rx="12" fill="#ffffff" stroke="#1b7c83" stroke-width="1.5"/>
  <text x="516" y="118" class="drv teal">macvlan / ipvlan</text>
  <text x="516" y="140" class="ph-sub">El contenedor se convierte en un equipo más de la LAN</text>

  <rect x="626" y="160" width="180" height="40" rx="8" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/>
  <text x="716" y="185" text-anchor="middle" class="h">Router · <tspan class="mono" style="font-weight:400">192.168.1.1</tspan></text>
  <line x1="716" y1="200" x2="716" y2="232" stroke="#57606a" stroke-width="2"/>
  <line x1="516" y1="232" x2="916" y2="232" stroke="#57606a" stroke-width="3"/>
  <text x="518" y="224" class="small">LAN (switch)</text>

  <line x1="572" y1="232" x2="572" y2="262" stroke="#57606a" stroke-width="2"/>
  <rect x="516" y="262" width="112" height="56" rx="8" fill="#ffffff" stroke="#57606a"/>
  <text x="572" y="285" text-anchor="middle" class="h">PC</text>
  <text x="572" y="304" text-anchor="middle" class="mono ip">192.168.1.30</text>

  <line x1="696" y1="232" x2="696" y2="262" stroke="#57606a" stroke-width="2"/>
  <rect x="640" y="262" width="112" height="56" rx="8" fill="#ffffff" stroke="#57606a"/>
  <text x="696" y="285" text-anchor="middle" class="h">Impresora</text>
  <text x="696" y="304" text-anchor="middle" class="mono ip">192.168.1.40</text>

  <line x1="790" y1="232" x2="790" y2="262" stroke="#57606a" stroke-width="2"/>
  <rect x="764" y="262" width="160" height="150" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-dasharray="5 4"/>
  <text x="776" y="400" class="hl" style="font-size:12px">Host</text>
  <text x="912" y="400" text-anchor="end" class="mono ip">192.168.1.20</text>
  <line x1="874" y1="232" x2="874" y2="300" stroke="#1b7c83" stroke-width="3"/>
  <rect x="780" y="300" width="128" height="78" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="844" y="322" text-anchor="middle" class="h">contenedor</text>
  <text x="844" y="342" text-anchor="middle" class="mono ip">192.168.1.50</text>
  <text x="844" y="362" text-anchor="middle" class="small">MAC propia</text>

  <text x="516" y="442" class="cap">El router lo ve como un dispositivo más, con su</text>
  <text x="516" y="460" class="cap">propia IP de la LAN (y su propia MAC en macvlan).</text>
  <text x="516" y="484" class="capm">ipvlan: idea parecida, pero comparte la MAC del host.</text>
  <text x="516" y="503" class="capm warn" style="font-weight:700">Solo en Linux nativo (no en Docker Desktop).</text>
</svg>
